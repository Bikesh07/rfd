<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Admin Intelligence Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">E</div><div><b>Exam Admin</b><small>Intelligence Portal</small></div></div>
  <nav>
    <button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button>
    <button class="nav-item" data-page="exams">▣ <span>Exams</span></button>
    <button class="nav-item" data-page="results">▤ <span>Results</span></button>
    <button class="nav-item" data-page="students">♙ <span>Students 360°</span></button>
    <button class="nav-item" data-page="analytics">◒ <span>Analytics</span></button>
    <button class="nav-item" data-page="comparison">⇄ <span>Comparison</span></button>
    <button class="nav-item" data-page="reports">⇩ <span>Reports</span></button>
    <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
  </nav>
  <div class="sidebar-bottom"><span class="dot"></span><span id="connectionLabel">Demo / Local</span></div>
</aside>
<main class="main">
<header class="topbar">
  <button class="hamburger" id="menuBtn">☰</button>
  <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Exam performance overview</p></div>
  <div class="top-actions">
    <select class="global-exam-filter" id="globalExamFilter"><option value="ALL">All Exams</option></select>
    <span id="lastUpdated">Ready</span>
    <button class="btn btn-primary" id="refreshBtn">↻ Refresh</button>
    <div class="avatar">A</div>
  </div>
</header>
<section class="content" id="content"></section>
</main></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<script src="app.js"></script>
</body></html>
